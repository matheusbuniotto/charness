# Configuração do c-harness
harness:
  # Diretório onde ficam as skills específicas para as runs
  skills_dir: "skills"
  
  # Skills globais a carregar de ~/.claude/skills ou .claude/skills do projeto.
  # Se vazio/ausente, carregará TODAS as skills globais encontradas (pode inflar muito o contexto).
  # global_skills:
  #   - "grug"
  #   - "harness"
  
  # Rastreio de uso de tokens e contexto
  metrics:
    save_tokens: true
    log_file: "metrics.json"

agents:
  # Default model per backend
  claude:
    model: "claude-sonnet-4-5"
  pi:
    model: "default"

  # Per-state model overrides (optional)
  # states:
  #   spec_generation:
  #     model: "claude-haiku-3-5-latest"   # cheaper for spec drafting
  #   implementation:
  #     model: "claude-opus-4-5"            # best model for heavy lifting
  #   evaluation:
  #     model: "claude-sonnet-4-5"
